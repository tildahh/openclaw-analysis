<!doctype html>
<!-- Source for decision-matrix.png, drawn with rough.js and the Excalidraw Virgil font.
     Counts come from results/labels.csv (my labels for the 27 heartbeats of September 28 to 29).
     The page title reports any text that crosses the edge. Re-export from this folder:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,760 --force-device-scale-factor=2 --virtual-time-budget=10000 \
       --screenshot=decision-matrix.png "file://$PWD/decision-matrix.html" -->
<html><head><meta charset="utf-8">
<title>Decision matrix</title>
<style>
  @font-face { font-family: "Virgil"; src: url("https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2") format("woff2"); }
  html, body { margin: 0; background: #1f2125; }
  svg { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
</head><body>
<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"></svg>
<script>
/* Draw a hand-drawn 2x2 of one day's heartbeat decisions: did something need me, and did it speak? */
const INK = "#e8e8e8", MUTED = "#b8bcc4", AMBER = "#e0b04a", TEAL = "#6fcf97", CORAL = "#f28b82",
      FONT = "Virgil, 'Comic Sans MS', cursive";
const svg = document.getElementById("c");
const rc = rough.svg(svg);

/** Add one line of handwritten text. */
function text(x, y, str, size, color = INK, anchor = "middle", rotate = 0) {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.setAttribute("font-family", FONT); t.setAttribute("font-size", size);
  t.setAttribute("fill", color); t.setAttribute("text-anchor", anchor);
  if (rotate) t.setAttribute("transform", `rotate(${rotate} ${x} ${y})`);
  t.textContent = str;
  svg.appendChild(t);
}

/** Draw one cell: a hatched box with a big count, a name and a note. */
function cell(x, y, w, h, color, seed, count, name, note) {
  svg.appendChild(rc.rectangle(x, y, w, h, { roughness: 1.3, stroke: color, strokeWidth: 2.4,
    fill: color + "30", fillStyle: "hachure", hachureGap: 15, fillWeight: 1.0, hachureAngle: -41, seed }));
  const cx = x + w / 2;
  text(cx, y + 112, count, 92, color);
  text(cx, y + 168, name, 30, INK);
  text(cx, y + 208, note, 21, MUTED);
}

document.fonts.load('34px "Virgil"').finally(() => {
  text(60, 60, "One day of heartbeats: should it have spoken, and did it?", 34, INK, "start");

  // Column headers.
  text(420, 138, "It sent a message", 30, INK);
  text(900, 138, "It stayed quiet", 30, INK);

  // Row labels.
  text(98, 300, "something needed me", 24, MUTED, "middle", -90);
  text(98, 580, "nothing needed me", 24, MUTED, "middle", -90);

  cell(180, 168, 480, 250, AMBER, 11, "5", "news buried in a recap", "right to speak, weak message");
  cell(700, 168, 400, 250, CORAL, 12, "1", "missed a reminder", "it never checked the reminders");
  cell(180, 448, 480, 250, CORAL, 13, "13", "redundant messages", "nothing new: most of the day's errors");
  cell(700, 448, 400, 250, TEAL, 14, "6", "correct silences", "a bare NO_REPLY, nothing sent");

  text(1100, 738, "25 decisions I labeled, September 28 to 29. One report I couldn't judge and one skipped heartbeat are left out.", 18, MUTED, "end");

  const W = 1200, H = 760, bad = [];
  for (const t of svg.querySelectorAll("text")) {
    const b = t.getBoundingClientRect();   // screen bounds, so rotated labels are measured as drawn
    if (b.left < 4 || b.top < 4 || b.right > W - 4 || b.bottom > H - 4) bad.push(t.textContent);
  }
  document.title = bad.length ? "OVERFLOW: " + bad.join(" | ") : "ready: no overflow";
});
</script>
</body></html>
